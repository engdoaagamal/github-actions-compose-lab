name: Docker Compose Integration Test

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start stack
        run: docker compose up -d

      - name: Wait
        run: sleep 15

      - name: Test service
        run: curl -f http://localhost:8080 || exit 1

      - name: Cleanup
        if: always()
        run: docker compose down
