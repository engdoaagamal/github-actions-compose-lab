on:
  pull_request:
    branches:
      - main

jobs:
  test-compose-stack:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the repository so we have the docker-compose.yml file
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Spin up the stack
      # Why? We run it in detached mode (-d) so the pipeline doesn't freeze waiting for it.
      - name: Start Docker Compose Stack
        run: docker-compose up -d

      # Step 3: Wait for containers to boot up
      # Why? Databases take a few seconds to initialize. If we test instantly, it might fail.
      - name: Wait for services to be ready
        run: sleep 15

      # Step 4: Run a network test (Integration Test)
      # Why? 'curl' fetches the webpage. If it returns an error, the pipeline fails!
      - name: Test the Web Service
        run: |
          echo "Testing if Nginx is responding on port 8080..."
          curl -f http://localhost:8080 || exit 1
          echo "Success! The stack is running perfectly."

      # Step 5: Clean up
      # Why? It is best practice to tear down resources and check the logs.
      - name: Tear down stack and show logs
        if: always() # This ensures it runs even if the test fails
        run: |
          docker-compose logs
          docker-compose down
